<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Merchant checkout — installment widget demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Dosis", system-ui, sans-serif;
        margin: 0;
        color: #242366;
        background: #f5f5f5;
      }
      .page {
        max-width: 480px;
        margin: 0 auto;
        padding: 40px 16px 64px;
      }
      .badge {
        display: block;
        width: fit-content;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #6f6fa0;
        border: 1px solid #e5e5f2;
        border-radius: 999px;
        padding: 3px 10px;
        margin: 0 auto 28px;
        background: #fff;
      }
      .hero {
        text-align: center;
        margin-bottom: 28px;
      }
      .hero img {
        width: 190px;
        height: 190px;
        margin-bottom: 8px;
      }
      .hero h1 {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      .hero p {
        font-size: 14px;
        font-weight: 500;
        color: #6f6fa0;
        margin: 0;
      }
      .widget-wrap {
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <span class="badge">Merchant page (self-hosted demo, not a live Blnk integration)</span>

      <div class="hero">
        <img src="/assets/hero.svg" alt="" />
        <h1>Split it, blnk it.</h1>
        <p>Tell us the amount and what you can pay — we'll suggest a plan.</p>
      </div>

      <div class="widget-wrap">
        <blnk-installment-widget
          data-api-base=""
          data-merchant-id="demo-merchant"
          data-amount="4500"
          data-min-amount="500"
          data-max-amount="15000"
        ></blnk-installment-widget>
      </div>
    </div>

    <script src="/widget.js"></script>
  </body>
</html>
