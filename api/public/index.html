<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Installment widget demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 16px;
        color: #101828;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #667085;
        border: 1px solid #d0d5dd;
        border-radius: 999px;
        padding: 3px 10px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <span class="badge">Self-hosted demo · not a live Blnk integration</span>
    <h1 style="font-size: 18px; margin-bottom: 4px;">Wireless Earbuds — EGP 4,500</h1>
    <p style="color: #667085; font-size: 14px;">Pay in installments</p>

    <blnk-installment-widget
      data-api-base=""
      data-merchant-id="demo-merchant"
      data-amount="4500"
    ></blnk-installment-widget>

    <p style="color: #98a2b3; font-size: 12px; margin-top: 32px;">
      Try any 14-digit number for the National ID field — the eligibility check is a
      deterministic mock, not a real underwriting call.
    </p>

    <script src="/widget.js"></script>
  </body>
</html>
