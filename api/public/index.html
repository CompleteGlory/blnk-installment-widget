<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Merchant checkout — installment widget demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Dosis", system-ui, sans-serif;
        max-width: 460px;
        margin: 48px auto;
        padding: 0 16px;
        color: #242366;
        background: #f5f5f5;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #6f6fa0;
        border: 1px solid #e5e5f2;
        border-radius: 999px;
        padding: 3px 10px;
        margin-bottom: 18px;
        background: #fff;
      }
      .product {
        background: #fff;
        border: 1px solid #e5e5f2;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 24px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .product .swatch {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: linear-gradient(135deg, #6aabdd, #242366);
        flex-shrink: 0;
      }
      .product h1 { font-size: 16px; margin: 0 0 4px; font-weight: 700; }
      .product p { font-size: 13px; margin: 0; color: #6f6fa0; font-weight: 500; }
    </style>
  </head>
  <body>
    <span class="badge">Merchant page (self-hosted demo, not a live Blnk integration)</span>

    <div class="product">
      <div class="swatch"></div>
      <div>
        <h1>Wireless Earbuds</h1>
        <p>Pay in installments at checkout</p>
      </div>
    </div>

    <blnk-installment-widget
      data-api-base=""
      data-merchant-id="demo-merchant"
      data-amount="4500"
      data-min-amount="500"
      data-max-amount="15000"
    ></blnk-installment-widget>

    <script src="/widget.js"></script>
  </body>
</html>
